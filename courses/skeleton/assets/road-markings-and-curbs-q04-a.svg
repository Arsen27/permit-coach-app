<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#8EC5E8"/><stop offset="1" stop-color="#D9EDF7"/>
</linearGradient>
<linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0B1B33"/><stop offset="1" stop-color="#26405F"/>
</linearGradient>
<linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#2E4A7A"/><stop offset="0.6" stop-color="#C97A5A"/>
  <stop offset="1" stop-color="#F0C08A"/>
</linearGradient>
<linearGradient id="skyStorm" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#5A6472"/><stop offset="1" stop-color="#98A2AE"/>
</linearGradient>
<linearGradient id="roadPersp" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#5A5F69"/><stop offset="1" stop-color="#3C4048"/>
</linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#9FC4DE"/><stop offset="1" stop-color="#6E93AE"/>
</linearGradient>
<radialGradient id="headBeam" cx="0.5" cy="0" r="1">
  <stop offset="0" stop-color="#FFF6C8" stop-opacity="0.85"/>
  <stop offset="1" stop-color="#FFF6C8" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glowW"><stop offset="0" stop-color="#fff" stop-opacity=".95"/>
  <stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="glowR"><stop offset="0" stop-color="#FF3B30" stop-opacity=".95"/>
  <stop offset="1" stop-color="#FF3B30" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB"><stop offset="0" stop-color="#3B82F6" stop-opacity=".95"/>
  <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
<radialGradient id="glowA"><stop offset="0" stop-color="#FFB020" stop-opacity=".95"/>
  <stop offset="1" stop-color="#FFB020" stop-opacity="0"/></radialGradient>
<filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.28"/>
</filter>
<filter id="tinyShadow" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.3"/>
</filter>
<filter id="blurLight"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="fogFilter"><feGaussianBlur stdDeviation="7"/></filter>
<pattern id="grassTex" width="26" height="26" patternUnits="userSpaceOnUse">
  <rect width="26" height="26" fill="#9CB380"/>
  <path d="M4 20 l3 -8 M13 24 l2 -9 M21 19 l3 -7" stroke="#8AA271" stroke-width="2"
        stroke-linecap="round" opacity=".7"/>
</pattern>
<pattern id="asphaltTex" width="8" height="8" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#4A4E57"/>
  <circle cx="2" cy="3" r="0.7" fill="#565A63"/><circle cx="6" cy="6" r="0.6" fill="#41454D"/>
</pattern>
</defs><rect x="0" y="0" width="1200" height="675" rx="0" fill="#C9BE9B" /><rect x="-20" y="96" width="1240" height="34" rx="0" fill="#B3A landfill" /></svg>